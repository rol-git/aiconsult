<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#0b6cb0" />
  <title>Нет сети — ЧС-Консультант</title>
  <style>
    :root { --primary: #0b6cb0; --bg: #f4f7fb; --ink: #1a2330; --muted: #6b7785; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: var(--bg); color: var(--ink); padding: 20px; }
    .card { max-width: 460px; width: 100%; background: #fff; border-radius: 16px; padding: 28px;
      box-shadow: 0 8px 30px rgba(11, 108, 176, 0.12); }
    .badge { width: 48px; height: 48px; border-radius: 12px; background: var(--primary);
      display: flex; align-items: center; justify-content: center; margin-bottom: 16px; }
    .badge svg { width: 28px; height: 28px; }
    h1 { font-size: 21px; margin: 0 0 8px; }
    p { line-height: 1.5; margin: 0 0 16px; color: var(--muted); }
    .phones { background: var(--bg); border-radius: 12px; padding: 16px; margin: 16px 0; }
    .phones .row { display: flex; justify-content: space-between; align-items: baseline; padding: 6px 0; }
    .phones .label { color: var(--muted); font-size: 14px; }
    .phones a { color: var(--primary); text-decoration: none; font-weight: 700; font-size: 17px; }
    button { width: 100%; background: var(--primary); color: #fff; border: 0; padding: 13px;
      border-radius: 10px; font-size: 16px; font-weight: 600; cursor: pointer; }
    button:active { opacity: 0.85; }
  </style>
</head>
<body>
  <div class="card">
    <div class="badge">
      <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M12 2 L2 7 v6 c0 5 4 8 10 9 c6-1 10-4 10-9 V7 Z" />
      </svg>
    </div>
    <h1>Нет интернет-соединения</h1>
    <p>Чат и карта временно недоступны. Ниже — экстренные телефоны Тюменской области, по ним можно позвонить без интернета.</p>

    <div class="phones">
      <div class="row"><span class="label">Единый телефон</span><a href="tel:112">112</a></div>
      <div class="row"><span class="label">МЧС по области</span><a href="tel:+73452909101">+7 (3452) 909-101</a></div>
      <div class="row"><span class="label">Горячая линия ЧС</span><a href="tel:88001000000">8 800 100-00-00</a></div>
    </div>

    <button onclick="location.reload()">Попробовать снова</button>
  </div>
</body>
</html>
