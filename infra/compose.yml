name: aiconsult

services:
  postgres:
    build:
      context: ./postgres
    container_name: aiconsult-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "${POSTGRES_PORT}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    container_name: aiconsult-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    ports:
      - "${REDIS_PORT}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  geo-service:
    build:
      context: ../services/geo-service
    container_name: aiconsult-geo
    restart: unless-stopped
    env_file:
      - .env
    environment:
      PORT: 5000
    ports:
      - "${GEO_PORT}:5000"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:5000/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  stt-service:
    build:
      context: ../services/stt-service
    container_name: aiconsult-stt
    restart: unless-stopped
    env_file:
      - .env
    environment:
      PORT: 5000
    ports:
      - "${STT_PORT}:5000"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:5000/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s

  rag-svc:
    build:
      context: ../services/rag-svc
    container_name: aiconsult-rag
    restart: unless-stopped
    env_file:
      - .env
    environment:
      PORT: 5000
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      REDIS_URL: redis://redis:6379/0
      GEO_SERVICE_URL: http://geo-service:5000
      DOCS_ROOT: /app/docs
    volumes:
      - ../docs:/app/docs:ro
    ports:
      - "${RAG_PORT}:5000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      geo-service:
        condition: service_started
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:5000/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 120s

  chat-api:
    build:
      context: ../services/chat-api
      dockerfile: Dockerfile
    container_name: aiconsult-chat-api
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      REDIS_URL: redis://redis:6379/0
      SERVER_PORT: 5000
      GEO_SERVICE_URL: http://geo-service:5000
      STT_SERVICE_URL: http://stt-service:5000
      RAG_SERVICE_URL: http://rag-svc:5000
    ports:
      - "${SERVER_PORT}:5000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      geo-service:
        condition: service_started
      stt-service:
        condition: service_started
      rag-svc:
        condition: service_started
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:5000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  support-rt:
    build:
      context: ../services/support-rt
      dockerfile: Dockerfile
    container_name: aiconsult-support-rt
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      REDIS_URL: redis://redis:6379/0
      PORT: 5000
    ports:
      - "${SUPPORT_RT_PORT}:5000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      chat-api:
        condition: service_started
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:5000/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  client:
    build:
      context: ../client
    container_name: aiconsult-client
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost/"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  gateway:
    build:
      context: ../services/gateway
    container_name: aiconsult-gateway
    restart: unless-stopped
    environment:
      SITE_ADDRESS: ${GATEWAY_SITE_ADDRESS:-http://:80}
    ports:
      - "${GATEWAY_PORT}:80"
      - "${GATEWAY_TLS_PORT}:443"
    depends_on:
      - chat-api
      - support-rt
      - geo-service
      - stt-service
      - rag-svc
      - client
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost/health"]
      interval: 10s
      timeout: 5s
      retries: 10

  docs-ingestor:
    build:
      context: ../services/docs-ingestor
    container_name: aiconsult-docs-ingestor
    restart: unless-stopped
    env_file:
      - .env
    environment:
      REDIS_URL: redis://redis:6379/0
      RAG_SERVICE_URL: http://rag-svc:5000
      INGEST_INTERVAL_HOURS: ${INGEST_INTERVAL_HOURS:-24}
    depends_on:
      redis:
        condition: service_healthy
      rag-svc:
        condition: service_started

volumes:
  postgres_data:
  redis_data:
  caddy_data:
  caddy_config:
